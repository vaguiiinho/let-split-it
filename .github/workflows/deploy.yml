name: CI/CD Docker Hub

on:
  push:
    branches: [ "main" ]

env:
  # Versão incrementada automaticamente a cada push (1.0.<nº da execução>)
  VERSION: 1.0.${{ github.run_number }}
  API_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/let-split-it-api
  WEB_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/let-split-it-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push API (NestJS)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.VERSION }}
            ${{ env.API_IMAGE }}:latest

      - name: Build and push Web (Next.js)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.VERSION }}
            ${{ env.WEB_IMAGE }}:latest

 # ==========================================
  # CD: deploy na VPS por SSH
  # ==========================================
  # Segredos (Settings > Secrets and variables > Actions > Secrets):
  #   VPS_HOST         IP ou domínio da VPS
  #   VPS_USER         usuário SSH (precisa rodar docker)
  #   VPS_SSH_KEY      chave PRIVADA de deploy (a pública vai no ~/.ssh/authorized_keys da VPS)
  #   VPS_KNOWN_HOSTS  saída de `ssh-keyscan -p <porta> <host>` (fixa a identidade da VPS; nada de StrictHostKeyChecking=no)
  # Variáveis (aba Variables): DEPLOY_ENABLED=true liga este job (deixe desligado até cadastrar os segredos);
  # opcionais: VPS_PORT (padrão 22), VPS_PATH (padrão /root/projects/finance).
  deploy:
    needs: build-and-push
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_PATH: ${{ vars.VPS_PATH || '/root/projects/split-it' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy/vps

      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      # O compose vai como .new: o deploy.sh valida antes de substituir (e guarda o anterior em .bak).
      - name: Enviar compose e script
        run: |
          ssh vps "mkdir -p '$VPS_PATH'"
          scp deploy/vps/docker-compose.yml "vps:$VPS_PATH/docker-compose.yml.new"
          scp deploy/vps/deploy.sh "vps:$VPS_PATH/deploy.sh"

      - name: Deploy ${{ env.VERSION }}
        run: ssh vps "bash '$VPS_PATH/deploy.sh' '$VERSION'"            
