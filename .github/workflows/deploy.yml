name: CI/CD Docker Hub

on:
  push:
    branches: [ "main" ]

env:
  # Versão incrementada automaticamente a cada push (1.0.<nº da execução>)
  VERSION: 1.0.${{ github.run_number }}
  API_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/let-split-it-api
  WEB_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/let-split-it-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push API (NestJS)
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.VERSION }}
            ${{ env.API_IMAGE }}:latest

      - name: Build and push Web (Next.js)
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.VERSION }}
            ${{ env.WEB_IMAGE }}:latest