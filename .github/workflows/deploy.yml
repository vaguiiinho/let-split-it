name: CI/CD Docker Hub

on:
  push:
    branches: [ "main" ]

env:
  VERSION: 1.0.${{ github.run_number }}
  REGISTRY_USER: vaguiiinho
  API_IMAGE_NAME: finance-api
  WEB_IMAGE_NAME: finance-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # ==========================================
      # BUILD E PUSH DA API (NestJS)
      # ==========================================
      - name: Build and push API image (NestJS)
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_USER }}/${{ env.API_IMAGE_NAME }}:${{ env.VERSION }}
          build-args: |
            NODE_ENV=production

      # ==========================================
      # BUILD E PUSH DO WEB (NextJS)
      # ==========================================
      - name: Build and push Web image (NextJS)
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_USER }}/${{ env.WEB_IMAGE_NAME }}:${{ env.VERSION }}
          build-args: |
            NODE_ENV=production